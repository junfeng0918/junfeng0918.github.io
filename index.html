<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🔨 打地鼠 · 欢乐版</title>
<meta name="description" content="30秒打地鼠挑战，金边地鼠+3分，看看你能打多少！">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overscroll-behavior: none; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: linear-gradient(180deg, #8fce74 0%, #6db254 55%, #568f41 100%);
    min-height: 100vh;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* ---------- 气球锤鼠标 ---------- */
  #hammer {
    position: fixed; left: -300px; top: -300px;
    width: 128px; height: 170px;
    pointer-events: none; z-index: 9999;
    opacity: 0;                                        /* 仅游戏中显示 */
    transform: translate(-64px, -35px) rotate(38deg);  /* 常态：斜举蓄力（锤头在鼠标点右上方） */
    transform-origin: 64px 150px;                      /* 旋转轴=握把末端 */
    transition: transform .1s ease-out, opacity .15s;
  }
  #hammer.show { opacity: 1; }
  /* 落下：锤头正好砸在鼠标点上 */
  #hammer.hit { transform: translate(-64px, -35px) rotate(0deg); }
  .h-head {
    position: absolute; top: 0; left: 0;
    width: 128px; height: 70px;
    border-radius: 35px;
    background: radial-gradient(ellipse at 32% 26%, #ff8a80 0%, #f44336 48%, #b71c1c 100%);
    box-shadow: inset 0 -7px 9px rgba(0,0,0,.22), inset 0 5px 7px rgba(255,255,255,.32), 0 4px 6px rgba(0,0,0,.3);
  }
  .h-head::before {  /* 充气高光 */
    content: ''; position: absolute; top: 10px; left: 17px;
    width: 40px; height: 15px; border-radius: 50%;
    background: rgba(255,255,255,.55); filter: blur(1px);
  }
  .h-head::after {  /* 充气嘴 */
    content: ''; position: absolute; right: -7px; top: 27px;
    width: 12px; height: 16px; border-radius: 4px; background: #8e1414;
  }
  .h-handle {
    position: absolute; top: 56px; left: 55px;
    width: 18px; height: 100px;
    border-radius: 9px;
    background: linear-gradient(90deg, #ffe082 0%, #ffb300 55%, #f57c00 100%);
    box-shadow: inset -3px 0 4px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.25);
  }
  @media (pointer: fine) { body { cursor: none; } }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; justify-content: center; gap: 14px;
    padding: 14px 10px 6px; flex-wrap: wrap;
  }
  .stat {
    background: rgba(255,255,255,.92);
    border-radius: 14px; padding: 8px 18px;
    font-size: 20px; font-weight: bold; color: #3c5a2b;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
    min-width: 108px; text-align: center;
  }
  .stat small { display:block; font-size: 11px; font-weight: normal; color: #7a9a66; letter-spacing: 2px; }
  #combo {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    font-size: 22px; font-weight: 900; color: #ff5722;
    text-shadow: 0 2px 0 #fff; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 50;
  }
  #combo.show { opacity: 1; }

  /* ---------- 时间条 ---------- */
  #timebarWrap {
    width: min(560px, 92vw); height: 14px; margin: 8px auto 0;
    background: rgba(0,0,0,.25); border-radius: 8px; overflow: hidden;
  }
  #timebar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ffb300, #ff7043);
    border-radius: 8px; transition: width 1s linear;
  }

  /* ---------- 游戏区 ---------- */
  #board {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 2vw, 20px);
    width: min(560px, 94vw);
    margin: 22px auto 0;
    touch-action: none;
  }
  .hole { position: relative; aspect-ratio: 10/9; }
  .mound {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; height: 28%;
    background: radial-gradient(ellipse at 50% 30%, #7c5a36 0%, #5d4126 70%);
    border-radius: 50%;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    z-index: 3;
  }
  .pit {
    position: absolute; bottom: 9%; left: 50%; transform: translateX(-50%);
    width: 92%; height: 55%;
    background: radial-gradient(ellipse at 50% 45%, #2e2013 0%, #1c1207 70%);
    border-radius: 50%;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.7);
    z-index: 2; overflow: hidden;
  }
  .mole {

    background-size: cover;
    background-position: center 12%;
    background-repeat: no-repeat;
    border-radius: 46% 46% 10% 10%;
    z-index: 1;
    cursor: none;
  }
  .mole.emoji {
    background-image: none !important;
    font-size: clamp(38px, 9vw, 62px);
    display: flex; align-items: center; justify-content: center;
    background: none;
  }
  .hole.up .mole { transform: translate(-50%, -4%); }
  .mole.golden {
    box-shadow: 0 0 0 3px #ffd54f, 0 0 16px 4px rgba(255,193,7,.85);
    border-radius: 46% 46% 10% 10%;
  }
  .mole.bonk { animation: bonk .32s forwards; }
  @keyframes bonk {
    0%   { transform: translate(-50%, -4%)  rotate(0)      scale(1);    filter: brightness(1); }
    35%  { transform: translate(-50%, 8%) rotate(-16deg) scale(1.06,.9); filter: brightness(1.7); }
    100% { transform: translate(-50%, 118%) rotate(12deg) scale(.95); filter: brightness(.55); }
  }

  /* ---------- 飘分 ---------- */
  .floaty {
    position: fixed; z-index: 9998; pointer-events: none;
    font-size: 24px; font-weight: 900; color: #ffeb3b;
    text-shadow: 0 2px 3px rgba(0,0,0,.5);
    animation: rise .75s ease-out forwards;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-64px) scale(1.35); }
  }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 40, 15, .72);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    color: #fff; text-align: center; padding: 20px;
  }
  .overlay h1 { font-size: clamp(34px, 8vw, 56px); text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .overlay p { font-size: 16px; line-height: 1.9; color: #dcedc8; }
  .overlay .score-big { font-size: 60px; font-weight: 900; color: #ffd54f; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  button {
    font-family: inherit;
    font-size: 24px; font-weight: bold; color: #fff;
    background: linear-gradient(180deg, #ff9800, #f57c00);
    border: none; border-radius: 999px;
    padding: 14px 52px;
    box-shadow: 0 6px 0 #c56a00, 0 10px 18px rgba(0,0,0,.3);
    cursor: pointer; letter-spacing: 4px;
  }
  button:active { transform: translateY(5px); box-shadow: 0 1px 0 #c56a00; }
  .hidden { display: none !important; }
  footer {
    position: fixed; bottom: 6px; width: 100%; text-align: center;
    color: rgba(255,255,255,.55); font-size: 12px; pointer-events: none;
  }
</style>

      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }
  var sndHit   = function () { beep(520, .12, 'square', .18, 180); };

  var sndTick  = function () { beep(700, .07, 'sine', .1); };

  /* ---------- 老旧 WebView（旧版微信 X5 等）不支持 PointerEvent：用 touchstart 模拟 ---------- */
  if (!window.PointerEvent) {
    document.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0];
      var ev = new MouseEvent('pointerdown', { clientX: t.clientX, clientY: t.clientY, bubbles: true, cancelable: true });
      e.target.dispatchEvent(ev);
      e.preventDefault();
    }, { passive: false });
  }

  /* ---------- 建 9 个坑 ---------- */
  for (var i = 0; i < 9; i++) {
    var hole = document.createElement('div');
    hole.className = 'hole';
    var pit = document.createElement('div');
    pit.className = 'pit';
    var mole = document.createElement('div');
    mole.className = 'mole' + (imgOK ? '' : ' emoji');
    if (!imgOK) mole.textContent = '🐹';
    pit.appendChild(mole);
    hole.appendChild(pit);
    var mound = document.createElement('div');
    mound.className = 'mound';
    hole.appendChild(mound);
    board.appendChild(hole);
    holes.push(hole);

    mole.addEventListener('pointerdown', function (e) {
      if (!playing || this.classList.contains('bonk')) return;
      e.stopPropagation();
      hitMole(this, e);
    });
    pit.addEventListener('pointerdown', function (e) {
      if (!playing) return;
      var hole = this.parentNode;
      var m = this.querySelector('.mole');
      // 坑内有鼠（且未被打中）：整个坑口都算命中区域，宽松判定
      if (hole.classList.contains('up') && m && !m.classList.contains('bonk')) {
        e.stopPropagation();
        hitMole(m, e);
        return;
      }
      onMiss(e);
    });
  }

  function floaty(x, y, text, color) {
    var f = document.createElement('div');
    f.className = 'floaty';
    f.textContent = text;
    if (color) f.style.color = color;
    f.style.left = (x - 14) + 'px';
    f.style.top = (y - 20) + 'px';
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 780);
  }

  function hitMole(mole, e) {
    var hole = mole.parentNode.parentNode;
    clearTimeout(parseInt(hole.dataset.timer, 10) || 0);
    mole.classList.add('bonk');
    swingHammer(e);   // 命中路径被 stopPropagation 隔离，需主动抡锤（传坐标，否则手机上看不见锤子）
    var golden = mole.dataset.golden === '1';
    var gain = golden ? 3 : 1;
    combo++;
    if (combo > 0 && combo % 5 === 0) { gain += 2; showCombo('连击 x' + combo + '  +2'); }
    score += gain;
    scoreEl.textContent = score;
    golden ? sndGold() : sndHit();
    floaty(e.clientX, e.clientY, golden ? '+' + gain + ' ⭐' : '+' + gain, golden ? '#ffd54f' : '#ffeb3b');
    setTimeout(function () {
      hole.classList.remove('up');
      mole.classList.remove('bonk', 'golden');
      delete mole.dataset.golden;
      delete hole.dataset.timer;
    }, 320);
  }

  function onMiss(e) {
    combo = 0;
    if (score > 0) score--;
    scoreEl.textContent = score;
    sndMiss();
    floaty(e.clientX, e.clientY, '-1', '#ef9a9a');
  }

  var comboTimer = null;
  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.add('show');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function () { comboEl.classList.remove('show'); }, 900);
  }

  /* ---------- 出鼠节奏 ---------- */
  function spawnMole() {
    if (!playing) return;
    var maxActive = Math.min(3, 1 + Math.floor(score / 12));
    var active = document.querySelectorAll('.hole.up').length;
    if (active < maxActive) {
      var free = holes.filter(function (h) { return !h.classList.contains('up'); });
      if (free.length) {
        var hole = free[Math.floor(Math.random() * free.length)];
        var mole = hole.querySelector('.mole');
        var golden = Math.random() < 0.12;
        if (golden) { mole.classList.add('golden'); mole.dataset.golden = '1'; }
        else { delete mole.dataset.golden; }
        hole.classList.add('up');
        sndPop();
        var upTime = Math.max(430, 1050 - score * 8 - (ROUND_TIME - timeLeft) * 7);
        hole.dataset.timer = setTimeout(function () {
          hole.classList.remove('up');
          mole.classList.remove('golden');
          delete mole.dataset.golden;
          delete hole.dataset.timer;
        }, upTime);
      }
    }
    var interval = Math.max(400, 880 - score * 6 - (ROUND_TIME - timeLeft) * 9);
    spawnTimer = setTimeout(spawnMole, interval);
  }

  /* ---------- 计时 ---------- */
  function tick() {
    if (!playing) return;
    timeLeft--;
    timeEl.textContent = timeLeft;
    timebar.style.width = (timeLeft / ROUND_TIME * 100) + '%';
    if (timeLeft <= 5 && timeLeft > 0) sndTick();
    if (timeLeft <= 0) endGame();
  }

  function startGame() {
    ensureAudio();
    clearTimeout(spawnTimer);   // 防重复点击/重开叠加出鼠链
    clearInterval(tickTimer);   // 防重复点击/重开叠加计时器（此前会多倍速烧时间）
    score = 0; combo = 0; timeLeft = ROUND_TIME;
    scoreEl.textContent = '0';
    timeEl.textContent = timeLeft;
    timebar.style.width = '100%';
    holes.forEach(function (h) {
      clearTimeout(parseInt(h.dataset.timer, 10) || 0);
      h.classList.remove('up');
      var m = h.querySelector('.mole');
      m.classList.remove('bonk', 'golden');
      delete m.dataset.golden;
      delete h.dataset.timer;
    });
    playing = true;
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    hammer.classList.add('show');   // 仅游戏中显示锤子，避免遮挡开始界面
    spawnTimer = setTimeout(spawnMole, 500);
    tickTimer = setInterval(tick, 1000);
  }

  function endGame() {
    if (!playing) return;   // 防幽灵计时器重入
    playing = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    holes.forEach(function (h) {
      clearTimeout(parseInt(h.dataset.timer, 10) || 0);
      h.classList.remove('up');
    });
    sndEnd();
    var isNewBest = score > best;
    if (isNewBest) {
      best = score;
      try { localStorage.setItem('mole_best', String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    var c = document.getElementById('endComment');
    if (isNewBest) c.textContent = '🎉 新纪录！手感发烫！';
    else if (score >= 40) c.textContent = '👏 高手！地鼠见你都发抖。';
    else if (score >= 20) c.textContent = '😄 不错不错，再来一局破纪录！';
    else if (score >= 1) c.textContent = '😅 热身完毕，正式开始了。';
    else c.textContent = '😴 地鼠们开香槟庆祝了……';
    endOverlay.classList.remove('hidden');
    hammer.classList.remove('show', 'hit');
    endAt = Date.now();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  // 开始界面：点任意处开局（预览/内嵌环境里按钮可能被上层吞点击）
  startOverlay.addEventListener('pointerdown', startGame);
  // 空格 / 回车 也可开局
  document.addEventListener('keydown', function (e) {
    if (playing) return;
    if (!startOverlay.classList.contains('hidden') || !endOverlay.classList.contains('hidden')) {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startGame(); }
    }
  });

  /* ---------- 锤子跟随与抡锤 ---------- */
  var swingTimer = null, touchHammerTimer = null, endAt = 0;
  var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  function swingHammer(e) {
    ensureAudio();   // iOS/微信 WebView 每次触摸尝试解锁音频
    if (isCoarse && e && typeof e.clientX === 'number') {
      // 触屏：锤子只在点击瞬间显示（手机上看不见鼠标，用锤子动画反馈落点）
      hammer.style.left = e.clientX + 'px';
      hammer.style.top = e.clientY + 'px';
      hammer.classList.add('show', 'hit');
      clearTimeout(swingTimer); clearTimeout(touchHammerTimer);
      swingTimer = setTimeout(function () { hammer.classList.remove('hit'); }, 170);
      touchHammerTimer = setTimeout(function () { hammer.classList.remove('show'); }, 300);
      return;
    }
    hammer.classList.add('hit');
    clearTimeout(swingTimer);
    swingTimer = setTimeout(function () { hammer.classList.remove('hit'); }, 170);
  }
  document.addEventListener('mousemove', function (e) {
    hammer.style.left = e.clientX + 'px';
    hammer.style.top = e.clientY + 'px';
  });
  document.addEventListener('pointerdown', swingHammer);
  // 结算界面：点任意处重开（延迟 0.9s 防最后一锤误触）
  endOverlay.addEventListener('pointerdown', function () {
    if (Date.now() - endAt > 900) startGame();
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
